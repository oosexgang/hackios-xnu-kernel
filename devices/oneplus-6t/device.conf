# devices/oneplus-6t/device.conf: what this device directory is. Laid out like hakios-sm7325's, so that it can become a device
# repository of its own (hakios-sdm845) when the common tree moves to tools/hakios-device.py.

device fajita
	title       OnePlus 6T (A6013)
	vendor      OnePlus
	soc         sdm845
	defconfig   fajita_defconfig
	firmware    pull-firmware.sh
	maintainer  the OnePlus 6T port (README.md)
	status      uefi        works     fajitaPkg: Mu-Silicium's enchiladaPkg with the 6T's name and 1080x2340 panel; Binaries/enchilada
	status      loader      works     platform "fajita" (UEFI's framebuffer at 0x9D400000); fastboot over USB with the old driver's quirks (usb_old_driver)
	status      display     works     the panel through UEFI's framebuffer, drawn in software: SpringBoard's home screen (30 October 2026)
	status      cpu         works     8 cores (bootcpu=7: the kernel on 7, the loader on 0), GICv3 where redwood's is, the virtual timer on intid 19 (soc_vtimer=19); small 0-3 (Kryo 385 Silver), big 4-7 (Kryo 385 Gold)
	status      storage     untested  UFS 2.1 (0x1d84000, 2 lanes), read through the loader as on redwood
	status      touch       missing   Synaptics S3320-family on I2C (QUP i2c@a90000, address 0x20, IRQ GPIO 125, reset GPIO 99)
	status      buttons     missing   power and volume on the PM8998, the alert slider (oneplus,tri-state-key)
	status      gpu         missing   Adreno 630 (chipid 0x6030001): a630_sqe.fw, a630_gmu.bin, a630_zap
	status      audio       missing   ADSP with Q6 APR (the WCD934x "tavil" codec)
	status      battery     missing   PMI8998's fuel gauge and charger, not through the ADSP as on redwood
	status      haptic      missing   PMI8998's haptics block at SPMI 0xc000 (qcom,qpnp-haptics)
	status      wifi        missing   WCN3990 (icnss; Linux's ath10k_snoc), firmware wlanmdsp.mbn loaded by the modem
	status      bluetooth   missing
	status      cellular    missing   IPA 3.5.1 (not 4.11), no IPCC, the modem loaded through the MBA rather than TrustZone's PAS
	status      thermal     missing   tsens at 0xc222000 and 0xc223000, not SC7280's
