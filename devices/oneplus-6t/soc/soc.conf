# soc/soc.conf: the facts of a Qualcomm SDM845 ("Snapdragon 845", "napali"), whatever phone it is in.
# A phone with this SoC includes configs/sdm845.config from its defconfig.

soc sdm845
	title       Qualcomm SDM845 (Snapdragon 845, "napali")
	vendor      Qualcomm
	cores       8, the biggest are cores 4-7
	gpu         Adreno 630
	maintainer  the OnePlus 6T port (README.md)
