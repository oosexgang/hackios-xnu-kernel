# mtk/mt6768/soc.conf: the MediaTek MT6768 (Helio G85), whatever phone it is in. A phone with this SoC says `soc mt6768` in its
# device.conf and includes configs/mt6768.config from its defconfig. docs/porting/repositories.md has every word; mtk/README.md
# says what the MediaTek part of this tree is.

soc mt6768
	title       MediaTek MT6768 family (Helio G85, G80, G88; "mt6768"/"mt6769" in the device tree)
	vendor      MediaTek
	cores       8: six Cortex-A55 (cores 0-5) and two Cortex-A75 (cores 6 and 7)
	gpu         Mali-G52 MC2
	maintainer  the HakiOS developers (mtk/README.md)
